<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Usuario</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f3f4f6;
    }
    form {
      background: white;
      padding: 25px 40px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
      width: 340px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .msg {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

  <form id="formRegistro">
    <h2>Registro de Usuario</h2>

    <label>Nombre:</label>
    <input type="text" name="nombre" required>

    <label>Apellido:</label>
    <input type="text" name="apellido" required>

    <label>Teléfono:</label>
    <input type="text" name="telefono" required>

    <label>Correo:</label>
    <input type="email" name="correo" required>

    <button type="submit">Enviar</button>
    <div class="msg" id="msg"></div>
  </form>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxxFv2c29hZekhHfdIVgiSv43EA9WS4jIL2sdTYPYwDpQbKOMOwbxjza3PJHfcjvdvIIg/exec";

    document.getElementById('formRegistro').addEventListener('submit', e => {
      e.preventDefault();

      const form = e.target;
      const formData = new FormData(form);

      fetch(scriptURL, {
        method: 'POST',
        body: formData
      })
      .then(response => {
        document.getElementById('msg').innerText = "✅ Datos enviados correctamente";
        form.reset();
      })
      .catch(error => {
        document.getElementById('msg').innerText = "❌ Error al enviar los datos";
        console.error('Error:', error);
      });
    });
  </script>

</body>
</html>
