<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Pedido</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f3f4f6;
    }
    form {
      background: white;
      padding: 25px 40px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
      width: 360px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    textarea {
      resize: vertical;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .msg {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

  <form id="formPedido">
    <h2>Registrar Pedido</h2>

    <label>Nombres:</label>
    <input type="text" name="nombres" required>

    <label>Correo:</label>
    <input type="email" name="correo" required>

    <label>Teléfono:</label>
    <input type="text" name="telefono" required>

    <label>Pedido:</label>
    <textarea name="pedido" rows="4" required></textarea>

    <button type="submit">Enviar</button>
    <div class="msg" id="msg"></div>
  </form>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwgtql-tElo73RQ9U1kO5S9b8tIvy5UqOT9_voqWuoxo9adYJiRTq0_qq8zwgHMXzFtRA/exec";

    document.getElementById('formPedido').addEventListener('submit', e => {
      e.preventDefault();

      const form = e.target;
      const formData = new FormData(form);

      fetch(scriptURL, {
        method: 'POST',
        body: formData
      })
      .then(response => response.text())
      .then(result => {
        document.getElementById('msg').innerText = "✅ Pedido enviado correctamente";
        form.reset();
      })
      .catch(error => {
        document.getElementById('msg').innerText = "❌ Error al enviar el pedido";
        console.error('Error:', error);
      });
    });
  </script>

</body>
</html>
